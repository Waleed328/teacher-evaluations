<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقييم الطلبة للتدريسيين — كلية علوم الحاسوب وتكنولوجيا المعلومات 2025/2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --surface-2:#F3F6F8; --ink:#13202B; --ink-2:#4A5C6B;
  --rule:#D2DBE3; --accent:#1F4E6B; --accent-soft:#DCE8EF;
  --s1:#A8453D; --s2:#BE7A2C; --s3:#9A8C2E; --s4:#4B8257; --s5:#276B4F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1720; --surface:#16202A; --surface-2:#1C2833; --ink:#E7EDF2; --ink-2:#9DAEBC;
    --rule:#2A3945; --accent:#7FB6D6; --accent-soft:#1E3444;
    --s1:#D9756C; --s2:#DDA45C; --s3:#C9BA5F; --s4:#74B384; --s5:#57A783;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1720; --surface:#16202A; --surface-2:#1C2833; --ink:#E7EDF2; --ink-2:#9DAEBC;
  --rule:#2A3945; --accent:#7FB6D6; --accent-soft:#1E3444;
  --s1:#D9756C; --s2:#DDA45C; --s3:#C9BA5F; --s4:#74B384; --s5:#57A783;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 70px}
h1,h2,h3{font-family:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:500;margin:0}
header.top{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:22px}
h1{font-size:clamp(20px,3.4vw,29px);line-height:1.35}
.sub{color:var(--ink-2);margin-top:6px;font-size:14px}
.kpis{display:flex;flex-wrap:wrap;gap:0;margin:22px 0 26px;background:var(--surface);
  border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.kpi{flex:1 1 150px;padding:14px 16px;border-left:1px solid var(--rule)}
.kpi:last-child{border-left:none}
.kpi b{display:block;font-family:"Readex Pro",sans-serif;font-size:25px;font-weight:600;line-height:1.2}
.kpi span{color:var(--ink-2);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tab{background:transparent;border:1px solid var(--rule);color:var(--ink-2);padding:7px 14px;border-radius:999px;
  cursor:pointer;font-family:inherit;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:18px 0 10px}
.sortsel{background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:4px;
  padding:7px 10px;font-family:inherit;font-size:14px}
.deptline{color:var(--ink-2);font-size:14px;margin:2px 0 0}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--rule);border-radius:4px}
.tablewrap{overflow-x:auto}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font-size:13px;color:var(--ink-2);font-weight:500;background:var(--surface-2);position:sticky;top:0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
td.rank{color:var(--ink-2);font-variant-numeric:tabular-nums;width:38px}
td.name{font-weight:600}
.meter{display:flex;align-items:center;gap:9px;min-width:190px}
.bar{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px}
.num{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;min-width:38px}
.rawnum{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px}
.grade{font-size:13px;padding:3px 9px;border-radius:3px;white-space:nowrap;color:#fff;display:inline-block}
.n{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.flag{color:var(--s2);font-size:12px}
tr.detail td{background:var(--surface-2);padding:6px 16px 18px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 26px;margin-top:6px}
.qrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.qrow span:first-child{flex:1;color:var(--ink-2)}
.qbar{width:64px;height:6px;background:var(--rule);border-radius:99px;overflow:hidden}
.qbar i{display:block;height:100%}
.qv{font-variant-numeric:tabular-nums;width:26px;text-align:left;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:16px 0 0;font-size:13px;color:var(--ink-2)}
.legend em{width:11px;height:11px;border-radius:2px;display:inline-block;margin-left:6px}
footer{margin-top:26px;color:var(--ink-2);font-size:12.5px}
@media (max-width:560px){ .hide-sm{display:none} .wrap{padding:18px 12px 60px} th,td{padding:9px 8px} }
</style>
</head>

const grade=m=>SCALE.find(s=>m>=s[0]);

let cur='الكل', sort='adj';

function agg(rows){const n=rows.reduce((a,b)=>a+b.n,0);return{n,m:rows.reduce((a,b)=>a+b.mean*b.n,0)/n,t:rows.length};}

const A=agg(DATA);
document.getElementById('kpis').innerHTML=[
 ['<b>'+A.m.toFixed(2)+'</b><span>المعدل الخام العام للكلية (من 5)</span>'],
 ['<b>'+A.t+'</b><span>تدريسي مشمول بالتقييم</span>'],
 ['<b>'+A.n+'</b><span>استمارة معتمدة في التحليل</span>'],
 ['<b>'+deps.length+'</b><span>أقسام علمية</span>']
].map(k=>'<div class="kpi">'+k+'</div>').join('');

const tabs=document.getElementById('tabs');
['الكل',...deps].forEach(d=>{const b=document.createElement('button');b.className='tab';b.textContent=d;

document.getElementById('sort').onchange=e=>{sort=e.target.value;render();};

document.getElementById('legend').innerHTML=SCALE.map(s=>'<span><em style="background:'+s[2]+'"></em>'+s[1]+(s[0]?' (‎'+s[0].toFixed(2)+' فأعلى)':' (أقل من 1.50)')+'</span>').join('')
 + '<span style="margin-right:auto"></span>';

function render(){
  let rows=DATA.filter(d=>cur==='الكل'||d.dep===cur);
  if(sort==='adj')rows=[...rows].sort((a,b)=>b.adj-a.adj||b.n-a.n);
  if(sort==='mean')rows=[...rows].sort((a,b)=>b.mean-a.mean||b.n-a.n);
  if(sort==='n')rows=[...rows].sort((a,b)=>b.n-a.n);
  if(sort==='name')rows=[...rows].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const g=agg(rows);
  document.getElementById('deptline').textContent=(cur==='الكل'?'جميع الأقسام':cur)+' — '+g.t+' تدريسي · '+g.n+' استمارة · المعدل الخام للقسم '+g.m.toFixed(2)+' من 5 ('+(g.m/5*100).toFixed(1)+'%)';
  const tb=document.getElementById('tb');tb.innerHTML='';
  rows.forEach((d,i)=>{
    const gr=grade(d.adj), pct=d.adj/5*100;
    const tr=document.createElement('tr');tr.className='row';

      '<td class="name">'+d.name+(d.n<3?' <span class="flag">◂ عينة صغيرة، n='+d.n+'</span>':'')+'</td>'+

      '<td class="n">'+d.n+'</td>'+

      '<div class="qrow" style="grid-column:1/-1;border-top:1px solid var(--rule);padding-top:8px;margin-top:4px;color:var(--ink-2)">'+
      'المعدل الخام: '+d.mean.toFixed(2)+' من '+d.n+' استمارة  ·  المعدل بعد التصحيح الإحصائي: '+d.adj.toFixed(2)+'</div></div></td>';
    tr.onclick=()=>{det.style.display=det.style.display==='none'?'table-row':'none';};
    tb.appendChild(tr);tb.appendChild(det);
  });
}
